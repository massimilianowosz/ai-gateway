components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Virtual API key (sk-ubq-xxx) or master key
    MasterKey:
      type: http
      scheme: bearer
      description: Master key (admin access only)

  parameters:
    HiveModel:
      name: X-Ubiquum-Model
      in: header
      required: true
      description: Model alias used to select the provider deployment that will own the file.
      schema:
        type: string
      example: azure-gpt-4o-mini
    FileID:
      name: file_id
      in: path
      required: true
      schema:
        type: string
      example: file-mh-8e148fa4915e4723a2f8ae90d26664aa

  schemas:
    Conversation:
      type: object
      properties:
        id:
          type: string
          example: conv_1787476570184281
        object:
          type: string
          example: conversation
        created_at:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties:
            type: string
    ConversationItemList:
      type: object
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            type: object
        first_id:
          type: string
        last_id:
          type: string
        has_more:
          type: boolean
    ChatCompletionRequest:
      type: object
      additionalProperties: true
      required: [model, messages]
      properties:
        model:
          type: string
          example: gpt-4o
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        temperature:
          type: number
        max_tokens:
          type: integer
        max_completion_tokens:
          type: integer
        top_p:
          type: number
        stream:
          type: boolean
        stream_options:
          type: object
          properties:
            include_usage:
              type: boolean
        response_format:
          type: object
        tools:
          type: array
          items:
            type: object
        tool_choice:
          oneOf:
            - type: string
            - type: object

    Message:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
        tool_calls:
          type: array
          items:
            type: object
        tool_call_id:
          type: string

    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: "#/components/schemas/Message"
              finish_reason:
                type: string
        usage:
          $ref: "#/components/schemas/Usage"

    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer

    Model:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: model
        created:
          type: integer
        owned_by:
          type: string
          example: ubiquum-ai-gateway

    FileObject:
      type: object
      required: [id, object, bytes, created_at, filename, purpose, status]
      properties:
        id:
          type: string
          example: file-mh-8e148fa4915e4723a2f8ae90d26664aa
        object:
          type: string
          const: file
        bytes:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        filename:
          type: string
        purpose:
          type: string
          example: user_data
        status:
          type: string
          enum: [uploaded, processed, error]

    FileList:
      type: object
      required: [object, data, has_more]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/FileObject"
        first_id:
          type: string
        last_id:
          type: string
        has_more:
          type: boolean

    FileDeleted:
      type: object
      required: [id, object, deleted]
      properties:
        id:
          type: string
        object:
          type: string
          const: file
        deleted:
          type: boolean

    APIKey:
      type: object
      properties:
        id:
          type: string
        key_prefix:
          type: string
        name:
          type: string
        team_id:
          type: string
        budget:
          type: number
        spend:
          type: number
        rate_limit:
          type: integer
          description: Requests per minute (0 = unlimited)
        models:
          type: array
          items:
            type: string
          description: Allowed models (empty = all)
        active:
          type: boolean
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateKeyParams:
      type: object
      properties:
        name:
          type: string
        team_id:
          type: string
        budget:
          type: number
        rate_limit:
          type: integer
        models:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time

    UpdateKeyParams:
      type: object
      properties:
        name:
          type: string
        budget:
          type: number
        rate_limit:
          type: integer
        models:
          type: array
          items:
            type: string
        active:
          type: boolean
        expires_at:
          type: string
          format: date-time

    GenerateKeyResponse:
      type: object
      properties:
        key:
          type: string
          description: Full API key (only shown once)
        key_prefix:
          type: string
        id:
          type: string
        name:
          type: string

    SpendRecord:
      type: object
      properties:
        id:
          type: string
        key_prefix:
          type: string
        team_id:
          type: string
        model:
          type: string
        provider:
          type: string
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        cost:
          type: number
        duration_ms:
          type: integer
        status:
          type: integer
        created_at:
          type: string
          format: date-time

    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        budget:
          type: number
        spend:
          type: number
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTeamParams:
      type: object
      required: [name]
      properties:
        name:
          type: string
        budget:
          type: number
        metadata:
          type: string

    UpdateTeamParams:
      type: object
      properties:
        name:
          type: string
        budget:
          type: number
        metadata:
          type: string
        active:
          type: boolean

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        team_id:
          type: string
        role:
          type: string
          enum: [admin, member]
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUserParams:
      type: object
      required: [email, team_id]
      properties:
        email:
          type: string
        name:
          type: string
        team_id:
          type: string
        role:
          type: string
          enum: [admin, member]

    UpdateUserParams:
      type: object
      properties:
        name:
          type: string
        team_id:
          type: string
        role:
          type: string
          enum: [admin, member]
        active:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string

    AnthropicMessageRequest:
      type: object
      required: [model, messages, max_tokens]
      properties:
        model:
          type: string
          example: claude-3-5-sonnet
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
        system:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
        max_tokens:
          type: integer
          example: 1024
        temperature:
          type: number
        top_p:
          type: number
        stop_sequences:
          type: array
          items:
            type: string
        stream:
          type: boolean
          default: false
        tools:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              input_schema:
                type: object

    AnthropicMessageResponse:
      type: object
      properties:
        id:
          type: string
          example: msg_01XFDUDYJgAACzvnptvVoYEL
        type:
          type: string
          example: message
        role:
          type: string
          example: assistant
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [text, tool_use]
              text:
                type: string
              id:
                type: string
              name:
                type: string
              input:
                type: object
        model:
          type: string
        stop_reason:
          type: string
          enum: [end_turn, max_tokens, tool_use, stop_sequence]
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer

    EmbeddingResponse:
      type: object
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            type: object
            properties:
              object:
                type: string
                example: embedding
              index:
                type: integer
              embedding:
                type: array
                items:
                  type: number
        model:
          type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            total_tokens:
              type: integer

    CompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: text_completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              index:
                type: integer
              finish_reason:
                type: string
                enum: [stop, length]
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer

    ModerationResponse:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        results:
          type: array
          items:
            type: object
            properties:
              flagged:
                type: boolean
              categories:
                type: object
                additionalProperties:
                  type: boolean
              category_scores:
                type: object
                additionalProperties:
                  type: number

    ImageResponse:
      type: object
      properties:
        created:
          type: integer
        data:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              b64_json:
                type: string
              revised_prompt:
                type: string

    TranscriptionResponse:
      type: object
      properties:
        text:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Access denied (model not allowed for this key)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit or budget exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpstreamError:
      description: Upstream provider error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found in the authenticated tenant scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
