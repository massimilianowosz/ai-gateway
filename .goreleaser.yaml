version: 2

project_name: ubiquum

before:
  hooks:
    - go mod tidy
    - go test -race ./...

builds:
  - id: ubiquum
    main: ./cmd/gateway
    binary: ubiquum
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

dockers:
  - image_templates:
      - "ghcr.io/ubiquum-ai/ubiquum:{{ .Version }}-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
    goarch: amd64
    dockerfile: Dockerfile.release
  - image_templates:
      - "ghcr.io/ubiquum-ai/ubiquum:{{ .Version }}-arm64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
    goarch: arm64
    dockerfile: Dockerfile.release

docker_manifests:
  - name_template: "ghcr.io/ubiquum-ai/ubiquum:{{ .Version }}"
    image_templates:
      - "ghcr.io/ubiquum-ai/ubiquum:{{ .Version }}-amd64"
      - "ghcr.io/ubiquum-ai/ubiquum:{{ .Version }}-arm64"
  - name_template: "ghcr.io/ubiquum-ai/ubiquum:latest"
    image_templates:
      - "ghcr.io/ubiquum-ai/ubiquum:{{ .Version }}-amd64"
      - "ghcr.io/ubiquum-ai/ubiquum:{{ .Version }}-arm64"
